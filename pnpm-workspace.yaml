packages:
  - "packages/*"
  - "examples/*"
  - "registry"
allowBuilds:
  # sass (a dev dependency, for the sandbox kit's Sass test) pulls @parcel/watcher's optional native
  # build for `sass --watch`; compiling runs without it.
  '@parcel/watcher': false
  '@biomejs/biome': true
  '@nestjs/core': false
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@dudousxd/*'
  - '@nestjs/ai@0.0.2'
  - '@nestjs/workflows@0.0.5'
  - '@nestjs/authorization@0.1.3'
  - '@nestjs/mcp@0.0.4'
overrides:
  # @dudousxd/nestjs-telescope 3.x pins better-sqlite3 11.10.0, which neither ships a prebuild for
  # nor compiles on Node 26. Drop this once the devDependency is on a telescope release with 12.x.
  '@dudousxd/nestjs-telescope>better-sqlite3': 12.11.1
