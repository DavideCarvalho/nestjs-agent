packages:
  - "packages/*"
  - "examples/*"
  - "registry"
allowBuilds:
  # sass (a dev dependency, for the sandbox kit's Sass test) pulls @parcel/watcher's optional native
  # build for `sass --watch`; compiling runs without it.
  '@parcel/watcher': false
  '@biomejs/biome': true
  '@nestjs/core': false
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@dudousxd/*'
