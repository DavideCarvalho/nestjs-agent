name: Release

on:
  push:
    branches: [master]
  # Re-run a publish that a registry refused. `changeset publish` only pushes versions the
  # registry does not already have, so a second run is a no-op once they are all there.
  workflow_dispatch:

# Never run two releases concurrently (avoids a double-publish race).
concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version PR or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" commit + git tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance (OIDC), harmless if unused
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
          # Point npm at the public registry; publish auth comes from OIDC trusted
          # publishing (see the changesets step), not a token.
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the step below would find nothing to publish and the new dependency would reach npm
      # only whenever someone next released by hand. This writes the changeset for it and
      # versions it in place, leaving the release a plain "nothing pending, publish" run.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const changed = git("diff", "--name-only", before + ".." + after)
            .split("\n")
            .filter((f) => f === "package.json" || f.endsWith("/package.json"));
          if (changed.length === 0) skip("no package.json changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) => JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"
          if [ -z "$(git status --porcelain .changeset)" ]; then exit 0; fi
          pnpm version-packages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      # When changesets are pending -> opens/updates the "Version Packages" PR.
      # When that PR is merged (versions bumped, no changesets left) -> runs
      # `pnpm release` (build all packages + `changeset publish`).
      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token at all: every @dudousxd/nestjs-agent* package has this workflow
          # registered as a Trusted Publisher on npm, so `changesets/action` (which only
          # falls back to OIDC when it finds no NPM_TOKEN) authenticates the publish via
          # the OIDC id-token (permissions.id-token: write) and NPM_CONFIG_PROVENANCE
          # attaches provenance. There is no NPM_TOKEN secret anymore.
          NPM_CONFIG_PROVENANCE: true
