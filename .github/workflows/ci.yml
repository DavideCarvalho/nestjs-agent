name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # The files people install, not the source: no built module may call `React.x` without
      # importing React, and every entry of the React package loads and renders with no global
      # React. A classic-JSX build passes every other step here and breaks in the consumer's browser.
      - run: pnpm check:dist
      - run: pnpm typecheck
      # Specs are excluded from every package's build tsconfig (they would be emitted to dist),
      # so `pnpm typecheck` never sees them. This is the same check with the specs included, for
      # the packages that are clean. Opting a package in: docs/typechecking-specs.md
      - run: pnpm typecheck:specs
      - run: pnpm test
      - run: pnpm test:db
