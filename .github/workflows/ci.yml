name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # Specs are excluded from every package's build tsconfig (they would be emitted to dist),
      # so `pnpm typecheck` never sees them. This is the same check with the specs included, for
      # the packages that are clean. Opting a package in: docs/typechecking-specs.md
      - run: pnpm typecheck:specs
      - run: pnpm test
      - run: pnpm test:db
