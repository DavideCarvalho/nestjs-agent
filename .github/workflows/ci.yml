name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Lint, build, package checks and typechecks run once, on the Node the release is built with.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:exports
      # publint and attw on every packed package: what a consumer installs resolves, types included.
      - run: pnpm check:package
      # The files people install, not the source: no built module may call `React.x` without
      # importing React, and every entry of the React package loads and renders with no global
      # React. A classic-JSX build passes every other step here and breaks in the consumer's browser.
      - run: pnpm check:dist
      - run: pnpm typecheck
      # Specs are excluded from every package's build tsconfig (they would be emitted to dist),
      # so `pnpm typecheck` never sees them. This is the same check with the specs included, for
      # the packages that are clean. Opting a package in: docs/typechecking-specs.md
      - run: pnpm typecheck:specs

  # Tests run on every Node major the packages support.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.2, 26.13.0]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Every store suite on SQLite, Postgres 16 and MySQL 8.4 (testcontainers, one container per
      # dialect for the run). Required: with `CI` set, a runner without Docker fails here rather
      # than quietly skipping the real databases.
      - run: pnpm test:db
